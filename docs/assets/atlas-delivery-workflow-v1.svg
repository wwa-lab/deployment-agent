<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1470" viewBox="0 0 1440 1470" role="img" aria-labelledby="title desc"><title id="title">Atlas Engineering Delivery Hub：实际能力协作</title><desc id="desc">Excel 校验后建立任务。人工路径记录结果；自动路径提交外部作业，默认关闭的轮询需启用才能同步。成功后人工评审，拒绝或失败可重跑，允许状态下可跳过。结果和尝试保留，未来扩展单独标识。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#171717"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b91c2b"/></marker></defs><rect width="1440" height="1470" fill="#faf9f6"/><g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif"><text x="56" y="54" font-size="20" fill="#b91c2b" font-weight="700">ATLAS / CAPABILITY FLOW</text><text x="56" y="118" font-size="44" fill="#171717" font-weight="800">执行、评审与证据怎样协作</text><text x="56" y="162" font-size="23" fill="#555" font-weight="400">实线：已有实现路径  ·  红色：人工决策 / 异常  ·  底部虚线框：计划或未验证</text><g id="entry"><rect x="56" y="206" width="365" height="130" rx="8" fill="#fff" stroke="#d5d5d5"/><text x="80" y="246" font-size="28" fill="#171717" font-weight="700">任务工作簿 + 阶段</text><text x="80" y="284" font-size="23" fill="#454545" font-weight="400">范围 / 所有者 / 流程标识</text></g><g id="validate"><rect x="500" y="206" width="335" height="130" rx="8" fill="#fff" stroke="#d5d5d5"/><text x="524" y="246" font-size="28" fill="#171717" font-weight="700">导入校验</text><text x="524" y="284" font-size="23" fill="#454545" font-weight="400">不合法 → 报错并修正</text></g><g id="hierarchy"><rect x="914" y="206" width="470" height="130" rx="8" fill="#171717" stroke="none"/><text x="938" y="246" font-size="28" fill="#fff" font-weight="700">发布 → 请求 → 任务</text><text x="938" y="284" font-size="23" fill="#fff" font-weight="400">按现有规则准备可执行任务</text></g><path d="M427 270H485" fill="none" stroke="#171717" stroke-width="3"  marker-end="url(#arrow)"/><path d="M841 270H899" fill="none" stroke="#171717" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1149 336V378H338V414" fill="none" stroke="#171717" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1149 378V414" fill="none" stroke="#171717" stroke-width="3"  marker-end="url(#arrow)"/><g id="manual"><rect x="56" y="428" width="564" height="136" rx="8" fill="#fff" stroke="#d5d5d5"/><text x="80" y="468" font-size="28" fill="#171717" font-weight="700">MANUAL / 人工工作</text><text x="80" y="506" font-size="23" fill="#454545" font-weight="400">人执行外部步骤，再记录结果</text><text x="80" y="538" font-size="23" fill="#454545" font-weight="400">可从就绪或执行中记录；非自动验真</text></g><g id="auto"><rect x="770" y="428" width="614" height="136" rx="8" fill="#fff" stroke="#d5d5d5"/><text x="794" y="468" font-size="28" fill="#171717" font-weight="700">AUTO / 外部工具提交</text><text x="794" y="506" font-size="23" fill="#454545" font-weight="400">Jenkins 或 Ansible / AWX</text><text x="794" y="538" font-size="23" fill="#454545" font-weight="400">提交成功后仍为 Executing</text></g><path d="M338 564V626" fill="none" stroke="#171717" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1077 564V626" fill="none" stroke="#171717" stroke-width="3"  marker-end="url(#arrow)"/><g id="review-state"><rect x="56" y="640" width="564" height="130" rx="8" fill="#171717" stroke="none"/><text x="80" y="680" font-size="28" fill="#fff" font-weight="700">Awaiting_Review / 待评审</text><text x="80" y="718" font-size="23" fill="#fff" font-weight="400">结果已记录，尚未被认可</text></g><g id="poll"><rect x="770" y="640" width="614" height="130" rx="8" fill="#fff" stroke="#d5d5d5"/><text x="794" y="680" font-size="28" fill="#171717" font-weight="700">同步外部结果 / 需配置启用</text><text x="794" y="718" font-size="23" fill="#454545" font-weight="400">轮询默认关闭；未知 / 运行中保持等待</text></g><path d="M770 705H634" fill="none" stroke="#171717" stroke-width="3"  marker-end="url(#arrow)"/><text x="650" y="690" font-size="22" fill="#171717" font-weight="400">成功</text><path d="M1077 770V832" fill="none" stroke="#b91c2b" stroke-width="3"  marker-end="url(#red)"/><text x="1090" y="811" font-size="21" fill="#b91c2b" font-weight="400">失败 / 中止 / 超时</text><path d="M338 770V832" fill="none" stroke="#b91c2b" stroke-width="3"  marker-end="url(#red)"/><g id="human-decision"><rect x="56" y="846" width="564" height="136" rx="8" fill="#b91c2b" stroke="none"/><text x="80" y="886" font-size="28" fill="#fff" font-weight="700">人工决策 / 所有者或管理员</text><text x="80" y="924" font-size="23" fill="#fff" font-weight="400">待评审可 Approve / Reject / Skip</text><text x="80" y="956" font-size="23" fill="#fff" font-weight="400">当前不强制双人审批</text></g><g id="failure"><rect x="770" y="846" width="614" height="136" rx="8" fill="#fff" stroke="#d5d5d5"/><text x="794" y="886" font-size="28" fill="#171717" font-weight="700">Failed / Rejected</text><text x="794" y="924" font-size="23" fill="#454545" font-weight="400">保留失败或拒绝状态及已有记录</text><text x="794" y="956" font-size="23" fill="#454545" font-weight="400">修正与恢复由人负责</text></g><path d="M620 914H756" fill="none" stroke="#b91c2b" stroke-width="3"  marker-end="url(#red)"/><text x="650" y="898" font-size="21" fill="#b91c2b" font-weight="400">Reject</text><path d="M338 982V1044" fill="none" stroke="#171717" stroke-width="3"  marker-end="url(#arrow)"/><text x="345" y="1020" font-size="22" fill="#171717" font-weight="400">Approve / Skip</text><path d="M1077 982V1044" fill="none" stroke="#b91c2b" stroke-width="3"  marker-end="url(#red)"/><g id="progress"><rect x="56" y="1058" width="564" height="136" rx="8" fill="#fff" stroke="#d5d5d5"/><text x="80" y="1098" font-size="28" fill="#171717" font-weight="700">按任务规则推进与汇总</text><text x="80" y="1136" font-size="23" fill="#454545" font-weight="400">关键任务待评审阻止下一任务就绪</text><text x="80" y="1168" font-size="23" fill="#454545" font-weight="400">全部 Approved / Skipped 可完成请求</text></g><g id="retry"><rect x="770" y="1058" width="614" height="136" rx="8" fill="#fff" stroke="#d5d5d5"/><text x="794" y="1098" font-size="28" fill="#171717" font-weight="700">Rerun / 新尝试</text><text x="794" y="1136" font-size="23" fill="#454545" font-weight="400">仅 Failed / Rejected 可回到就绪</text><text x="794" y="1168" font-size="23" fill="#454545" font-weight="400">重复执行不覆盖旧尝试</text></g><path d="M1384 1120H1414V270H1387" fill="none" stroke="#b91c2b" stroke-width="3"  marker-end="url(#red)"/><text x="56" y="1246" font-size="24" fill="#b91c2b" font-weight="400">Skip 也允许从 Pending / Ready_For_Execution 发起；跳过不等于执行成功。</text><text x="56" y="1290" font-size="24" fill="#171717" font-weight="400">贯穿输出：输入快照、任务结果、外部链接、执行历史和操作审计；不是认证归档。</text><rect x="56" y="1320" width="1328" height="106" rx="6" fill="none" stroke="#777" stroke-dasharray="8 6"/><text x="80" y="1361" font-size="26" fill="#555" font-weight="600">计划 / 未验证：iSeries 一键发布、自动回滚、AI 决策与真实环境重复交付</text><text x="80" y="1402" font-size="24" fill="#555" font-weight="400">Agent Skills 支持开发与文档协作，不是这条运行时流程中的自动审批引擎。</text></g></svg>
