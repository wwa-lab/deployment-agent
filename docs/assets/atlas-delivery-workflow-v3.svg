<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1640" viewBox="0 0 1440 1640" role="img" aria-labelledby="title desc">
<title id="title">从平台到 Deployment：原子化、自动化、智能化</title><desc id="desc">当前实现用实线，UTL 接入待核验和智能化方向用虚线。人工梳理 BAU 与 SOP，形成任务；MANUAL 由人执行，AUTO 通过 Jenkins 或 AWX 提交、轮询，之后按结果进入人工评审或失败处理。记录输出与尝试，未来辅助决策仍由人确认。</desc>
<defs>
 <linearGradient id="background" x2=".8" y2="1"><stop stop-color="#050b16"/><stop offset="1" stop-color="#0b1934"/></linearGradient>
 <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#142b45"/><stop offset="1" stop-color="#091626"/></linearGradient>
 <linearGradient id="active" x2="1" y2="1"><stop stop-color="#1837a0"/><stop offset="1" stop-color="#0d465f"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#185ccb" stop-opacity=".3"/><stop offset="1" stop-color="#185ccb" stop-opacity="0"/></radialGradient>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#62e8ff" stroke-width="1.3"/></marker>
 <marker id="future-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#8da6cb" stroke-width="1.3"/></marker>
</defs>
<rect width="1440" height="1640" fill="url(#background)"/>
<ellipse cx="1180" cy="574" rx="590" ry="984" fill="url(#halo)"/>
<g id="atmosphere" fill="#7598c4" opacity=".28"><circle cx="40" cy="25" r="1.5"/><circle cx="237" cy="188" r="0.8"/><circle cx="434" cy="351" r="0.8"/><circle cx="631" cy="514" r="0.8"/><circle cx="828" cy="677" r="0.8"/><circle cx="1025" cy="840" r="0.8"/><circle cx="1222" cy="1003" r="1.5"/><circle cx="69" cy="1166" r="0.8"/><circle cx="266" cy="1329" r="0.8"/><circle cx="463" cy="1492" r="0.8"/><circle cx="660" cy="60" r="0.8"/><circle cx="857" cy="223" r="0.8"/><circle cx="1054" cy="386" r="1.5"/><circle cx="1251" cy="549" r="0.8"/><circle cx="98" cy="712" r="0.8"/><circle cx="295" cy="875" r="0.8"/><circle cx="492" cy="1038" r="0.8"/><circle cx="689" cy="1201" r="0.8"/><circle cx="886" cy="1364" r="1.5"/><circle cx="1083" cy="1527" r="0.8"/><circle cx="1280" cy="95" r="0.8"/><circle cx="127" cy="258" r="0.8"/><circle cx="324" cy="421" r="0.8"/><circle cx="521" cy="584" r="0.8"/><circle cx="718" cy="747" r="1.5"/><circle cx="915" cy="910" r="0.8"/><circle cx="1112" cy="1073" r="0.8"/><circle cx="1309" cy="1236" r="0.8"/><circle cx="156" cy="1399" r="0.8"/><circle cx="353" cy="1562" r="0.8"/><circle cx="550" cy="130" r="1.5"/><circle cx="747" cy="293" r="0.8"/><circle cx="944" cy="456" r="0.8"/><circle cx="1141" cy="619" r="0.8"/><circle cx="1338" cy="782" r="0.8"/></g>
<g font-family="'Avenir Next','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="56" y="57" font-size="27" fill="#eef5ff" font-weight="750">ATLAS</text><text x="185" y="57" font-size="21" fill="#91abc7" font-weight="400">/ PLATFORM → DEPLOYMENT AGENT</text><path d="M56 81L1384 81" fill="none" stroke="#536f954d" stroke-width="2"/><text x="56" y="151" font-size="49" fill="#eef5ff" font-weight="700">把规范、任务与执行连接起来。</text><text x="56" y="199" font-size="25" fill="#b3c8df" font-weight="400">实线：已有实现基础     虚线：接入待核验 / 后续能力</text><g id="platform"><path d="M56 240H1368L1384 256V396H72L56 380Z" fill="url(#panel)" stroke="#41668c" stroke-width="1.5"/></g><text x="80" y="283" font-size="31" fill="#eef5ff" font-weight="650">Agentic SDLC 平台</text><text x="80" y="332" font-size="27" fill="#c8d7ed" font-weight="400">规范与 Agent Skills 协作 · Build / Testing / Deployment 工作区</text><text x="80" y="372" font-size="25" fill="#a9bdd5" font-weight="400">共享任务模型、配置、权限与审计 · 当前实践：IBM iSeries</text><text x="56" y="453" font-size="28" fill="#62e8ff" font-weight="600">01 / 原子化 · 将工作整理成可执行单元</text><g id="bau"><path d="M56 488H440L456 504V639H72L56 623Z" fill="url(#panel)" stroke="#41668c" stroke-width="1.5"/></g><text x="80" y="533" font-size="30" fill="#eef5ff" font-weight="650">BAU Tasks</text><text x="80" y="580" font-size="24" fill="#c5d5e8" font-weight="400">日常运维与发布经验</text><text x="80" y="614" font-size="24" fill="#a9bdd5" font-weight="400">由人梳理工作边界</text><g id="sop"><path d="M520 488H904L920 504V639H536L520 623Z" fill="url(#panel)" stroke="#41668c" stroke-width="1.5"/></g><text x="544" y="533" font-size="30" fill="#eef5ff" font-weight="650">标准化 SOP</text><text x="544" y="580" font-size="24" fill="#c5d5e8" font-weight="400">输入 / 操作 / 预期输出</text><text x="544" y="614" font-size="24" fill="#a9bdd5" font-weight="400">明确验证与责任</text><g id="task"><path d="M984 488H1368L1384 504V639H1000L984 623Z" fill="url(#active)" stroke="#41668c" stroke-width="1.5"/></g><text x="1008" y="533" font-size="30" fill="#eef5ff" font-weight="650">原子任务</text><text x="1008" y="580" font-size="24" fill="#c5d5e8" font-weight="400">模板、分组与步骤顺序</text><text x="1008" y="614" font-size="24" fill="#a9bdd5" font-weight="400">发布 → 请求 → 任务</text><path d="M456 561H516" fill="none" stroke="#62e8ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M920 561H980" fill="none" stroke="#62e8ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1184 639V666H720V741" fill="none" stroke="#62e8ff" stroke-width="2.5" marker-end="url(#arrow)"/><text x="56" y="710" font-size="28" fill="#62e8ff" font-weight="600">02 / 自动化 · 复用工具，保留人工步骤</text><path d="M720 735H256V761" fill="none" stroke="#62e8ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 735H1184V761" fill="none" stroke="#8da6cb" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#future-arrow)"/><g id="manual"><path d="M56 765H440L456 781V938H72L56 922Z" fill="url(#panel)" stroke="#41668c" stroke-width="1.5"/></g><text x="80" y="812" font-size="29" fill="#eef5ff" font-weight="650">MANUAL</text><text x="80" y="861" font-size="24" fill="#c5d5e8" font-weight="400">人执行并记录结果</text><text x="80" y="903" font-size="24" fill="#a9bdd5" font-weight="400">结果进入待评审</text><g id="auto"><path d="M520 765H904L920 781V938H536L520 922Z" fill="url(#active)" stroke="#41668c" stroke-width="1.5"/></g><text x="544" y="812" font-size="29" fill="#eef5ff" font-weight="650">Jenkins / Ansible</text><text x="544" y="861" font-size="24" fill="#c5d5e8" font-weight="400">AUTO 提交 → Executing</text><text x="544" y="903" font-size="24" fill="#a9bdd5" font-weight="400">轮询需配置启用</text><g id="utl"><path d="M984 765H1368L1384 781V938H1000L984 922Z" fill="url(#panel)" stroke="#8da6cb" stroke-width="1.5" stroke-dasharray="8 7"/></g><text x="1008" y="812" font-size="29" fill="#eef5ff" font-weight="650">Health Check UTL</text><text x="1008" y="861" font-size="24" fill="#c5d5e8" font-weight="400">IBM iSeries 实践工具</text><text x="1008" y="903" font-size="24" fill="#a9bdd5" font-weight="400">调用与运行证据待补</text><path d="M256 938V986H488V1045" fill="none" stroke="#62e8ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 938V986H488" fill="none" stroke="#62e8ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1184 938V986H953V1117H925" fill="none" stroke="#8da6cb" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#future-arrow)"/><g id="review-and-output"><path d="M56 1050H904L920 1066V1315H72L56 1299Z" fill="url(#panel)" stroke="#41668c" stroke-width="1.5"/></g><text x="80" y="1096" font-size="31" fill="#eef5ff" font-weight="650">结果记录 → 人工评审 → 按规则推进</text><text x="80" y="1143" font-size="25" fill="#c5d5e8" font-weight="400">AUTO 成功结果进入待评审；失败进入失败处理</text><text x="80" y="1185" font-size="24" fill="#c5d5e8" font-weight="400">所有者 / 管理员决策；关键任务待评审阻止下一任务就绪</text><text x="80" y="1227" font-size="24" fill="#c5d5e8" font-weight="400">失败或拒绝可重跑；允许状态可跳过，跳过不等于成功</text><text x="80" y="1273" font-size="24" fill="#a9bdd5" font-weight="400">输出：输入快照、外部链接、结果、决策与每次尝试</text><g id="future-intelligence"><path d="M984 1050H1368L1384 1066V1315H1000L984 1299Z" fill="url(#panel)" stroke="#8da6cb" stroke-width="1.5" stroke-dasharray="8 7"/></g><text x="1008" y="1096" font-size="30" fill="#62e8ff" font-weight="650">03 / 智能化</text><text x="1008" y="1143" font-size="24" fill="#c5d5e8" font-weight="400">规范 + 任务 + 执行证据</text><text x="1008" y="1185" font-size="24" fill="#c5d5e8" font-weight="400">编排建议 / 异常解释</text><text x="1008" y="1227" font-size="24" fill="#c5d5e8" font-weight="400">辅助决策 · 人工确认</text><text x="1008" y="1273" font-size="24" fill="#a9bdd5" font-weight="400">演进方向 · 尚待实现验证</text><path d="M920 1227H980" fill="none" stroke="#8da6cb" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#future-arrow)"/><path d="M56 1370L1384 1370" fill="none" stroke="#536f954d" stroke-width="2"/><text x="56" y="1415" font-size="30" fill="#62e8ff" font-weight="650">可复用的基础</text><text x="56" y="1461" font-size="29" fill="#eef5ff" font-weight="500">任务契约、执行器接口、工作区、治理与证据模型</text><text x="56" y="1508" font-size="25" fill="#c5d5e8" font-weight="400">需适配：具体语言 / 平台的 SOP、目标工具、结果解析与验收规则。</text><text x="56" y="1565" font-size="24" fill="#a9bdd5" font-weight="400">AI Assist 当前为预览；UTL 专用集成尚未核验。跨平台兼容需对应场景证据。</text><text x="56" y="1608" font-size="24" fill="#a9bdd5" font-weight="400">详细执行状态与异常分支参见执行状态详图 v1；人工评审不是强制双人审批。</text>
</g></svg>
