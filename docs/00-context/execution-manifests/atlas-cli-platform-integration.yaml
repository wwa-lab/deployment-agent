  forbidden_paths:
    - .env
    - frontend/package-lock.json
    - pom.xml
    - /Users/leo/wwa-lab/GitHub/atlas-cli/
    - secrets/
  external_actions_require_approval: true
  architectural_boundaries:
    - Platform Core owns Execution, Artifact, Telemetry, idempotency, correlation, audit, and review services.
    - Agent Modules may supply fixed scope adapters but contain no duplicated lifecycle logic.
    - Atlas is the sole source of Task and Execution business state.
    - Client state changes must pass TaskStateMachine and active-Execution fencing.
    - Atlas Server must not run local Skills, inference runtimes, repository scanners, or LangGraph.
  security_boundaries:
    - Never expose tokens, credentials, signed URLs, absolute local paths, prompts, environment variables, or complete source content.
    - Reauthorize every write and idempotent replay; preserve cross-scope not-found behavior.
    - Validate bounded uploads by size, digest, name, path label, media type, scope, and Execution ownership.

