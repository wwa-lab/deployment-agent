# ─── H2 in-memory datasource for tests ───────────────────────────────────────
#
# Oracle/H2 compatibility note:
#   - JSON columns are defined with columnDefinition="CLOB" for Oracle.
#     H2 handles CLOB storage correctly for test-scale payloads.
#   - Oracle CLOB size limits (up to 4 GB) are not enforced by H2; flag
#     any production concern with oversized payloads separately.
#   - H2 MODE=Oracle enables Oracle-compatible SQL dialect.
#
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Enable header-based auth fallback in tests (existing tests use X-User-Id/X-User-Role headers)
app.auth.header-fallback-enabled=true

# ─── External Execution Monitor (disabled in tests by default) ────────────────
execution.monitor.enabled=false
execution.monitor.poll-delay-ms=30000
execution.monitor.batch-size=50

app.config.crypto.secret=test-only-config-secret

app.skillhub.storage-directory=${user.dir}/target/skill-hub-test-files
