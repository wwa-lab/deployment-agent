# ─── Oracle Datasource ─────────────────────────────────────────────────────
# Activate with: --spring.profiles.active=test
# Override these via environment variables or an external config in production-like environments.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:da_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# validate: Hibernate checks schema against entities on startup (recommended for shared environments).
# Flyway (below) is the authoritative schema migrator; Hibernate only validates
# that entities match the schema Flyway produced.
spring.jpa.hibernate.ddl-auto=validate

# ─── Flyway ──────────────────────────────────────────────────────────────────
# Flyway owns schema migration for the dev (Oracle) profile. On a fresh DB it
# applies V*.sql files in order. On a pre-existing Oracle schema that was
# hand-migrated before Flyway was introduced, baseline-on-migrate=true tells
# Flyway to record the current state as the baseline (without re-running old
# migrations) so new migrations start from the existing version.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
# Fail fast if a previously-applied migration's checksum changes — prevents
# silent schema drift caused by editing a migration after it has been applied.
spring.flyway.validate-on-migrate=true
