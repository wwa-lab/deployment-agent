# ─── Application ─────────────────────────────────────────────────────────────spring.application.name=deployment-agent# ─── Oracle Datasource ────────────────────────────────────────────────────────# Override these via environment variables or an external config in production.spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}spring.datasource.username=${DB_USERNAME:da_user}spring.datasource.password=${DB_PASSWORD:changeme}spring.datasource.driver-class-name=oracle.jdbc.OracleDriver# ─── JPA / Hibernate ─────────────────────────────────────────────────────────spring.jpa.database-platform=org.hibernate.dialect.OracleDialect# validate: Hibernate checks schema against entities on startup (recommended for production).# Use 'update' during early development only.spring.jpa.hibernate.ddl-auto=validatespring.jpa.show-sql=falsespring.jpa.properties.hibernate.format_sql=falsespring.jpa.open-in-view=false# ─── Jackson ─────────────────────────────────────────────────────────────────spring.jackson.serialization.write-dates-as-timestamps=falsespring.jackson.default-property-inclusion=non_null# ─── Server ──────────────────────────────────────────────────────────────────server.port=8080server.servlet.context-path=/# ─── Auth ────────────────────────────────────────────────────────────────────# Disable header-based auth fallback in production (use session login instead)app.auth.header-fallback-enabled=false