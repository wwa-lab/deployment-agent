# ─── Application ─────────────────────────────────────────────────────────────
spring.application.name=agenthub

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── Flyway ──────────────────────────────────────────────────────────────────
# Flyway is disabled by default and enabled only in the dev (Oracle) profile.
# Rationale: local/test profiles use Hibernate ddl-auto for fast iteration
# and rely on JPA entities as the schema source of truth. The dev (Oracle)
# profile uses Flyway as the authoritative schema migrator, reading from
# src/main/resources/db/migration/V*.sql.
spring.flyway.enabled=false

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ─── Auth ────────────────────────────────────────────────────────────────────
# Disable header-based auth fallback by default (use session login instead)
app.auth.header-fallback-enabled=false
app.auth.session-grant-revalidation-enabled=true

# Atlas Integration Artifact transport ceiling. The service independently
# verifies the exact byte count, digest, media policy, and active Execution.
app.integration.max-artifact-bytes=52428800
app.integration.max-text-artifact-bytes=5242880
app.integration.max-json-artifact-bytes=5242880
app.integration.max-json-artifact-tokens=100000
app.integration.max-json-artifact-nesting-depth=64
app.integration.max-artifacts-per-execution=100
app.integration.max-artifact-bytes-per-execution=524288000
app.integration.max-concurrent-artifact-transfers=2
app.integration.max-concurrent-artifact-transfers-per-client=1
app.integration.max-approved-inputs-per-task=100
app.integration.max-artifacts-per-task=500
app.integration.max-artifact-bytes-per-task=1073741824
app.integration.max-executions-per-task=10
app.integration.max-progress-events-per-execution=1000
app.integration.rate-limit-capacity=120
app.integration.rate-limit-refill-per-second=2
app.integration.authentication-attempt-rate-limit-capacity=30
app.integration.authentication-attempt-rate-limit-refill-per-second=0.5
app.integration.idempotency-in-progress-timeout=30m
app.integration.artifact-content-retention=30d
app.integration.artifact-retention-cleanup-batch-size=200
app.integration.artifact-retention-cleanup-max-batches-per-run=20
app.integration.retention-cleanup-delay-ms=3600000
app.integration.require-external-artifact-scanner=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# ─── External Execution Monitor ──────────────────────────────────────────────
# Set to true to enable background polling of active AUTO executions.
# Start with false and enable progressively in each environment.
execution.monitor.enabled=false
execution.monitor.poll-delay-ms=30000
execution.monitor.batch-size=50

# ─── Sensitive Configuration Encryption ──────────────────────────────────────
# Override in non-local environments. Used to encrypt stored credentials.
app.config.crypto.secret=${APP_CONFIG_CRYPTO_SECRET:local-dev-only-config-secret-change-me}

# ─── Logging ─────────────────────────────────────────────────────────────────
# Include the correlation ID (populated by CorrelationIdFilter via MDC) in
# every log line so operators can stitch together a single request across
# controllers, services, audit writes, and external execution submissions.
# The "-" placeholder keeps the layout stable when no correlation is set
# (e.g. background jobs that run outside an HTTP request).
logging.pattern.level=%5p [%X{correlationId:--}]
