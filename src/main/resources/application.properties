# ─── Application ─────────────────────────────────────────────────────────────
spring.application.name=agenthub

# ─── File Uploads ───────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=500MB


# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── Flyway ──────────────────────────────────────────────────────────────────
# Flyway is disabled by default and enabled only in the dev (Oracle) profile.
# Rationale: local/test profiles use Hibernate ddl-auto for fast iteration
# and rely on JPA entities as the schema source of truth. The dev (Oracle)
# profile uses Flyway as the authoritative schema migrator, reading from
# src/main/resources/db/migration/V*.sql.
spring.flyway.enabled=false

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ─── Auth ────────────────────────────────────────────────────────────────────
# Disable header-based auth fallback by default (use session login instead)
app.auth.header-fallback-enabled=false

# ─── External Execution Monitor ──────────────────────────────────────────────
# Set to true to enable background polling of active AUTO executions.
# Start with false and enable progressively in each environment.
execution.monitor.enabled=false
execution.monitor.poll-delay-ms=30000
execution.monitor.batch-size=50

# ─── Sensitive Configuration Encryption ──────────────────────────────────────
# Override in non-local environments. Used to encrypt stored credentials.
app.config.crypto.secret=${APP_CONFIG_CRYPTO_SECRET:local-dev-only-config-secret-change-me}

# ─── Logging ─────────────────────────────────────────────────────────────────
# Include the correlation ID (populated by CorrelationIdFilter via MDC) in
# every log line so operators can stitch together a single request across
# controllers, services, audit writes, and external execution submissions.
# The "-" placeholder keeps the layout stable when no correlation is set
# (e.g. background jobs that run outside an HTTP request).
logging.pattern.level=%5p [%X{correlationId:--}]
